name: Scraper Automático — TrackerAds

on:
  schedule:
    - cron: '0 12 * * *'   # 09:00 BRT (UTC-3)
    - cron: '0 0 * * *'    # 21:00 BRT (UTC-3)
  workflow_dispatch:         # permite rodar manualmente pela aba Actions

jobs:
  scrape:
    name: Executar Scraping
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scraper-service/package.json

      - name: Instalar dependências
        working-directory: ./scraper-service
        run: npm install

      - name: Instalar Chromium + dependências do sistema
        working-directory: ./scraper-service
        run: npx playwright install chromium --with-deps

      - name: Rodar scraping
        working-directory: ./scraper-service
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node run-once.js
