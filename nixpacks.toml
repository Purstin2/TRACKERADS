[phases.setup]
nixPkgs = ['nodejs', 'python3']

[phases.install]
cmds = [
    'cd scraper-service && npm ci',
    'cd scraper-service && npx playwright install-deps',
    'cd scraper-service && npx playwright install chromium'
]

[phases.build]
cmds = ['echo "Build phase complete"']

[start]
cmd = 'cd scraper-service && node server.js'
